# Local SearXNG for Life Graph's web_search tool (docs/specs/assistant-capabilities.md, Phase A).
# Run: docker/searxng/run.sh  ->  LIFE_GRAPH_SEARXNG_URL=http://localhost:8888
use_default_settings: true
server:
  # Replaced at container start by run.sh with a random value.
  secret_key: "__SECRET__"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false
  public_instance: false
search:
  safe_search: 1
  formats:
    - html
    - json
ui:
  static_use_hash: true
