[project]
name = "life-graph"
# Kept in step with the newest released heading in CHANGELOG.md. `pyproject.toml`
# had drifted behind at 1.0.0 while the changelog already documented 1.1.0.
version = "1.1.0"
description = "Brain-inspired memory microservice for SaaS applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "racer"}]
keywords = [
    "memory",
    "ai-agents",
    "llm",
    "rag",
    "vector-search",
    "knowledge-graph",
    "pgvector",
    "fastapi",
    "multi-tenant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    # Alembic connects over the SYNC url (alembic/env.py uses
    # settings.database_url_sync, i.e. postgresql://), which needs a psycopg2
    # driver — asyncpg cannot serve it. This was only ever installed by a
    # manual append in the Dockerfile, so containers worked while
    # `pip install -e ".[dev]"` produced a tree where `alembic upgrade head`
    # died with ModuleNotFoundError. Migrations run in production too, via
    # scripts/entrypoint.sh, so this belongs in the runtime dependencies.
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pgvector>=0.3",

    # numpy is a REAL core dependency: services/transcript_extractor.py imports
    # it at module level, so `import life_graph.main` fails without it. It was
    # never declared because spacy/sentence-transformers dragged it in
    # transitively; moving those to an extra exposed the omission.
    "numpy>=1.26",

    # NLP & ML: spacy and sentence-transformers moved to the `local-nlp` extra
    # (see below). Between them they pulled the CUDA torch stack — nvidia
    # 2.7 GB + torch 1.1 GB + triton 690 MB — into every install, GPU or not,
    # making `pip install life-graph` a 5.4 GB download. Both are imported
    # lazily behind guards (extraction/nlp.py loads spaCy inside a method;
    # services/embeddings.py catches ImportError), so their absence is a
    # supported state, not a crash.

    # LLM (routing only, minimal usage)
    "litellm>=1.40",
    "google-auth>=2.30",  # Vertex AI credential handling (litellm's vertex_ai/* provider)

    # Cold Start
    # pydriller and radon moved to the `cold-start` extra (see below):
    # radon is imported nowhere in life_graph/, and pydriller is imported
    # lazily inside ColdStartGitAnalyzer with an ImportError guard that logs
    # "pydriller not installed — skipping Git analysis" and returns [].
    # pyyaml stays: it is a hard dependency of the cold-start config loader.
    "pyyaml>=6.0",

    # Utilities
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "orjson>=3.10",

    # Object Storage
    "minio>=7.2",

    # Redis & Background Jobs (SaaS)
    "redis[hiredis]>=5.0",
    "arq>=0.26",

    # Observability
    "prometheus-client>=0.20",

    # MCP Server (Model Context Protocol)
    "fastmcp>=2.0",
    "mcp>=1.29.0",

    # Web Push Notifications
    "pywebpush>=2.0",
]

[project.optional-dependencies]
multimodal = [
    "faster-whisper>=1.0",
    "pytesseract>=0.3",
    "pymupdf>=1.24",
    "Pillow>=10.0",
]
# Repo mining for the cold-start bootstrap (`life-graph cold-start`). Both are
# optional at runtime; without them git analysis is skipped with a warning.
cold-start = [
    "pydriller>=2.6",
    "radon>=6.0",
]
# Local NLP and embeddings. Without this extra there is no in-process
# embedding model, so an embedding backend must be configured instead
# (LIFE_GRAPH_USE_LOCAL_LLM with LM Studio, or a remote provider) — with no
# backend configured at all the app refuses to start rather than silently
# storing empty vectors.
#
# This pulls the default CUDA build of torch. For CPU-only machines install
# torch first from the CPU index, which drops ~3.4 GB:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install "life-graph[local-nlp]"
local-nlp = [
    "spacy>=3.7",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.16.1",  # pinned: an unpinned linter breaks CI with no code change
    "httpx>=0.27",
    "testcontainers[postgres]>=4.7",
]
# Everything a full self-hosted deployment uses, so `pip install life-graph[all]`
# reproduces the old all-in-one install in one line.
all = [
    "life-graph[multimodal,cold-start,local-nlp]",
]

[project.scripts]
life-graph = "life_graph.cli:main"

[project.urls]
Homepage = "https://github.com/Raceraja001/life-graph"
Repository = "https://github.com/Raceraja001/life-graph"
Issues = "https://github.com/Raceraja001/life-graph/issues"
Documentation = "https://github.com/Raceraja001/life-graph/blob/master/docs/STATE.md"
Changelog = "https://github.com/Raceraja001/life-graph/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Packaging ────────────────────────────────────────────────────────────────
# NOTE FOR FUTURE MAINTAINERS: this project builds with **hatchling**, not
# setuptools, so a `MANIFEST.in` would be silently ignored. The sdist/wheel
# contents are controlled entirely by the two tables below.

[tool.hatch.build.targets.wheel]
# A directory, not a module list: hatchling walks `life_graph/` recursively, so
# every current and future subpackage (life_graph/integrations/, …) is picked up
# automatically. Do NOT replace this with an explicit per-package list — a new
# subpackage would then be dropped from the wheel with no error.
packages = ["life_graph"]

[tool.hatch.build.targets.wheel.force-include]
# Alembic revisions live outside the package but are needed to create the schema.
# A wheel install would otherwise have no way to run `alembic upgrade head`.
# These ship as inert data today; wiring a `life-graph migrate` command to them
# is a source-level change tracked separately (see docs/RELEASE.md).
"alembic" = "life_graph/_alembic"
"alembic.ini" = "life_graph/_alembic/alembic.ini"

[tool.hatch.build.targets.sdist]
# Allow-list, not a deny-list: anything not named here cannot leak into the
# tarball, which is what keeps .env, .comms/, logs/, .run/ and friends out even
# when a new secret-bearing file appears at the repo root.
include = [
    "/life_graph",
    "/alembic",
    "/alembic.ini",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CHARTER.md",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/docs/STATE.md",
    "/docs/QUICKSTART.md",
    "/docs/OPERATIONS.md",
    "/docs/RELEASE.md",
    "/docs/ARCHITECTURE.md",
    "/pyproject.toml",
    "/.env.example",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/*.png",
    "**/*.jpg",
    "**/*.zip",
    "**/.ruff_cache",
]
# tests/fixtures IS shipped, deliberately. It is 48 KB of plain text and four
# unit modules import from it, so dropping it would put a test suite in the
# tarball that cannot run. To leave tests out of the sdist entirely, remove
# "/tests" from `include` above rather than excluding the fixtures.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking (see per-file-ignores for route modules)
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# main.py imports routers mid-file on purpose, interleaved with the
# include_router call each one feeds, to keep the wiring readable and to
# sidestep import cycles. Hoisting 27 imports to the top would obscure that.
# schemas.py defers two imports past a runtime guard for the same reason.
"life_graph/autonomy/safety/schemas.py" = ["E402"]
# TC is off for modules that DEFINE FastAPI routes. FastAPI resolves each
# handler's signature at runtime via get_type_hints() to build validation and
# the OpenAPI schema; a name that only exists under TYPE_CHECKING raises
# PydanticUserError("... is not fully defined") when the schema is built.
# `runtime-evaluated-base-classes` below covers Pydantic/SQLAlchemy models but
# not route handler parameters, which are plain function annotations.
#
# This was verified rather than assumed: applying the rule everywhere broke
# `app.openapi()` (205 paths / 242 operations / 99 schemas). Restricting it to
# non-route modules fixes 121 of the 165 findings with the schema build and
# both suites unchanged. The remaining 44 live in the modules below.
#
# The globs cover all 45 route-defining modules, so a new route file is
# exempt automatically rather than failing CI on its first import.
"life_graph/api/*.py" = ["TC"]
"life_graph/**/router.py" = ["TC"]
"life_graph/main.py" = ["E402", "TC"]
"life_graph/core/metrics.py" = ["TC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection callables are *meant* to be evaluated in
# argument defaults — that is the framework's entire calling convention.
# Without this, B008 fires on every single injected dependency.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy resolve annotations at RUNTIME. Moving these
# imports into a TYPE_CHECKING block — which is what TC001/2/3 ask for —
# breaks model construction with an unresolved-forward-ref error at import
# time. Declaring the runtime-evaluated bases keeps the rules on for code
# where they are safe.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "life_graph.models.db.Base",
]
runtime-evaluated-decorators = ["pydantic.validate_call", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["life_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine in life_graph/storage/database.py is created at import time with
# a real connection pool. pytest-asyncio otherwise gives each test its own
# event loop, so pooled connections bind to the first loop and every later
# test fails with "attached to a different loop" — then exhausts the pool,
# because connections on abandoned loops are never returned. Sharing one loop
# across the session keeps the pool valid.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
