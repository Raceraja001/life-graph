[project]
name = "life-graph"
# Kept in step with the newest released heading in CHANGELOG.md. `pyproject.toml`
# had drifted behind at 1.0.0 while the changelog already documented 1.1.0.
version = "1.1.0"
description = "Brain-inspired memory microservice for SaaS applications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "racer"}]
keywords = [
    "memory",
    "ai-agents",
    "llm",
    "rag",
    "vector-search",
    "knowledge-graph",
    "pgvector",
    "fastapi",
    "multi-tenant",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Version policy (audit P1, 2026-11-20)
# - uv.lock is what actually gets installed (CI, the Docker image, releases);
#   these ranges only say what the code is known to work with.
# - Upper bounds ("<NEXT_MAJOR") are set ONLY on fast-moving, breaking-prone or
#   security-sensitive libraries, at the next major after the locked version
#   (for 0.x libraries: <1). A major release of those has broken this codebase
#   or is documented as breaking, and a resolver must not pick one up silently
#   when the lock is refreshed. Everything else stays open: capping all of it
#   only blocks fixes.
# - Dependabot (`uv` ecosystem, .github/dependabot.yml) raises a cap in a PR of
#   its own when the next major ships; that PR is where the upgrade is tested.
#   Never raise a cap without re-running `uv lock` and the full CI.
dependencies = [
    # API
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",

    # Database
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    # Alembic connects over the SYNC url (alembic/env.py uses
    # settings.database_url_sync, i.e. postgresql://), which needs a psycopg2
    # driver — asyncpg cannot serve it. This was only ever installed by a
    # manual append in the Dockerfile, so containers worked while
    # `pip install -e ".[dev]"` produced a tree where `alembic upgrade head`
    # died with ModuleNotFoundError. Migrations run in production too, via
    # scripts/entrypoint.sh, so this belongs in the runtime dependencies.
    "psycopg2-binary>=2.9",
    "alembic>=1.13,<2",
    "pgvector>=0.3",

    # numpy is a REAL core dependency: services/transcript_extractor.py imports
    # it at module level, so `import life_graph.main` fails without it. It was
    # never declared because spacy/sentence-transformers dragged it in
    # transitively; moving those to an extra exposed the omission.
    "numpy>=1.26",

    # NLP & ML: spacy and sentence-transformers moved to the `local-nlp` extra
    # (see below). Between them they pulled the CUDA torch stack — nvidia
    # 2.7 GB + torch 1.1 GB + triton 690 MB — into every install, GPU or not,
    # making `pip install life-graph` a 5.4 GB download. Both are imported
    # lazily behind guards (extraction/nlp.py loads spaCy inside a method;
    # services/embeddings.py catches ImportError), so their absence is a
    # supported state, not a crash.

    # LLM (routing only, minimal usage)
    "litellm>=1.40,<2",
    "google-auth>=2.30",  # Vertex AI credential handling (litellm's vertex_ai/* provider)
    # services/llm/client.py imports openai directly (OpenAI/AsyncOpenAI for
    # LM Studio and OpenRouter), lazily but with no ImportError guard. It only
    # ever arrived transitively through litellm; declared so a change in
    # litellm's own requirements cannot remove it from under us.
    "openai>=1.40,<3",
    # Powers the diff-reading second-opinion reviewer (services/dev/pr_agent_review.py)
    # -- a real driver dispatch, not a dev-only tool, so this is a runtime
    # dependency like litellm above, not the `dev` extra pip-audit lives in.
    # Python>=3.12 only (pr-agent's own requirement) -- this project supports
    # >=3.11, so the marker keeps a 3.11 install resolvable. The reviewer
    # already fails open (approves, ran=False) when the binary is missing,
    # so a 3.11 environment simply never runs this check, same as any other
    # project that lacks it for the tools verifiers.py already covers.
    "pr-agent>=0.47; python_version >= '3.12'",

    # Cold Start
    # pydriller and radon moved to the `cold-start` extra (see below):
    # radon is imported nowhere in life_graph/, and pydriller is imported
    # lazily inside ColdStartGitAnalyzer with an ImportError guard that logs
    # "pydriller not installed — skipping Git analysis" and returns [].
    # pyyaml stays: it is a hard dependency of the cold-start config loader.
    "pyyaml>=6.0",

    # Connectors
    # plugins/calendar/connector.py parses ICS feeds with these. The import is
    # lazy but unguarded, so a missing package is a 500 on any calendar sync
    # rather than a degraded mode — and CI has been red since the connector
    # merge because neither was ever declared. Both are small and pure Python.
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",

    # Utilities
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9",
    # orjson used to be declared here, but nothing imports it (no
    # ORJSONResponse either), so it was dropped (audit M21, 2026-11-19).

    # Object Storage
    "minio>=7.2",

    # Redis & Background Jobs (SaaS)
    "redis[hiredis]>=5.0,<6",
    "arq>=0.26,<1",

    # Observability
    "prometheus-client>=0.20",

    # MCP Server (Model Context Protocol)
    "fastmcp>=2.0,<5",
    "mcp>=1.29.0,<3",

    # Web Push Notifications
    "pywebpush>=2.0",

    # Transitive via pywebpush/py-vapid, google-auth and others, but pinned
    # here directly: 49.0.0 carries PYSEC-2026-3552 / CVE-2026-69247, a
    # timing side channel in PKCS#7/S-MIME decryption (pkcs7_decrypt_der/
    # _pem/_smime). Nothing in life_graph calls those specifically, but the
    # fix is a drop-in version bump with no known breaking API change, so
    # there is no reason to stay on the vulnerable version once caught by
    # no_vulnerable_deps_in_diff.
    "cryptography>=50.0",
]

[project.optional-dependencies]
multimodal = [
    "faster-whisper>=1.0",
    "pytesseract>=0.3",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    # extraction/parsers.py parses .docx uploads with it; without it the
    # parser returns an "unavailable" message instead of the document text.
    "python-docx>=1.1",
]
# Optional watcher features. Each is imported lazily behind an ImportError
# guard, so a missing package disables only that feature, with a warning:
#   aiosmtplib -- watchers/channels/email_channel.py (email notifications)
#   asyncssh   -- watchers/server_health_watcher.py (SSH server health checks)
#   GitPython  -- watchers/code_quality_watcher.py (code quality watcher)
watchers = [
    "aiosmtplib>=3.0",
    "asyncssh>=2.14",
    "GitPython>=3.1",
]
# Repo mining for the cold-start bootstrap (`life-graph cold-start`). Both are
# optional at runtime; without them git analysis is skipped with a warning.
cold-start = [
    "pydriller>=2.6",
    "radon>=6.0",
]
# Local NLP and embeddings. Without this extra there is no in-process
# embedding model, so an embedding backend must be configured instead
# (LIFE_GRAPH_USE_LOCAL_LLM with LM Studio, or a remote provider) — with no
# backend configured at all the app refuses to start rather than silently
# storing empty vectors.
#
# This pulls the default CUDA build of torch. For CPU-only machines install
# torch first from the CPU index, which drops ~3.4 GB:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
#   pip install "life-graph[local-nlp]"
local-nlp = [
    "spacy>=3.7",
    "sentence-transformers>=3.0,<7",
    # Not a new dependency: sentence-transformers always pulled it in. Named
    # here only so [tool.uv.sources] below can lock it to the CPU index (uv
    # sources apply to direct dependencies only).
    "torch>=2.2",
]
# Driving the sandboxed browser (services/browser_sandbox_driver.py). Only the
# *client* — the browser itself lives in the container from
# compose.sandbox.yaml, so nothing is downloaded by `playwright install` here
# and no browser ever runs on the host. The client version must match the
# Playwright base image in Dockerfile.browser (v1.52.0): the browser bundles
# baked into that image are the ones that release expects.
#
# Without this extra there is no way to connect to the runtime, and browser
# errands fail closed with "isolated browser sandbox is offline" rather than
# running somewhere less contained. The unit suite needs none of it — it
# injects a transport.
browser-sandbox = [
    "playwright==1.65.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",  # pytest -n auto; test ids must be the same in every worker
    "ruff==0.17.6",  # pinned: an unpinned linter breaks CI with no code change
    # Pinned for the same reason: each mypy release adds checks, so a new
    # version would move the committed error baseline (mypy-api-baseline.txt)
    # with no code change. Raise it in a PR of its own and re-record
    # .github/mypy-api-strict-baseline.txt there. Unrelated to the verifier image's mypy (docker/verifier),
    # which checks agent projects, not this one.
    "mypy==2.4.1",
    # No httpx here: it is a core dependency already. No testcontainers
    # either: nothing imported it (the integration job runs its own Postgres).
    "pip-audit>=2.7",  # powers the no_vulnerable_deps_in_diff verifier
    # Layer contracts in [tool.importlinter] below (audit M12/M13): api ->
    # services -> core/storage. Static analysis only; checked by the CI
    # `import-contracts` job.
    # Pinned to releases more than two months old (supply-chain caution, as
    # with LiteLLM/Trivy in 2026-10); grimp is its import-graph engine.
    "import-linter==2.15",
    "grimp==3.20",
]
# Everything a full self-hosted deployment uses, so `pip install life-graph[all]`
# reproduces the old all-in-one install in one line.
all = [
    "life-graph[multimodal,cold-start,local-nlp,browser-sandbox,watchers]",
]

[project.scripts]
life-graph = "life_graph.cli:main"

[project.urls]
Homepage = "https://github.com/Raceraja001/life-graph"
Repository = "https://github.com/Raceraja001/life-graph"
Issues = "https://github.com/Raceraja001/life-graph/issues"
Documentation = "https://github.com/Raceraja001/life-graph/blob/master/docs/STATE.md"
Changelog = "https://github.com/Raceraja001/life-graph/blob/master/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── uv (lockfile) ────────────────────────────────────────────────────────────
# torch (pulled in by the local-nlp extra via sentence-transformers) is locked
# to the CPU build from PyTorch's own index on Linux and Windows. CI and the
# Docker image always installed it that way (`pip install torch --index-url
# .../whl/cpu` first); with the lock authoritative the CPU choice has to be in
# the lock, or `uv sync --extra local-nlp` would install the default CUDA build
# (+~3.4 GB of nvidia-* wheels) that no runner or container uses. macOS wheels
# on PyPI are CPU-only already. `explicit = true`: only torch comes from that
# index, everything else still resolves from PyPI. This is uv-only metadata:
# `pip install life-graph[local-nlp]` from PyPI is unaffected. A GPU machine
# that wants CUDA torch installs it over the synced env (see docs/QUICKSTART.md).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

# ── Packaging ────────────────────────────────────────────────────────────────
# NOTE FOR FUTURE MAINTAINERS: this project builds with **hatchling**, not
# setuptools, so a `MANIFEST.in` would be silently ignored. The sdist/wheel
# contents are controlled entirely by the two tables below.

[tool.hatch.build.targets.wheel]
# A directory, not a module list: hatchling walks `life_graph/` recursively, so
# every current and future subpackage (life_graph/integrations/, …) is picked up
# automatically. Do NOT replace this with an explicit per-package list — a new
# subpackage would then be dropped from the wheel with no error.
packages = ["life_graph"]

[tool.hatch.build.targets.wheel.force-include]
# Alembic revisions live outside the package but are needed to create the schema.
# A wheel install would otherwise have no way to run `alembic upgrade head`.
# These ship as inert data today; wiring a `life-graph migrate` command to them
# is a source-level change tracked separately (see docs/RELEASE.md).
"alembic" = "life_graph/_alembic"
"alembic.ini" = "life_graph/_alembic/alembic.ini"

[tool.hatch.build.targets.sdist]
# Allow-list, not a deny-list: anything not named here cannot leak into the
# tarball, which is what keeps .env, .comms/, logs/, .run/ and friends out even
# when a new secret-bearing file appears at the repo root.
include = [
    "/life_graph",
    "/alembic",
    "/alembic.ini",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CHARTER.md",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/docs/STATE.md",
    "/docs/QUICKSTART.md",
    "/docs/OPERATIONS.md",
    "/docs/RELEASE.md",
    "/docs/ARCHITECTURE.md",
    "/pyproject.toml",
    "/.env.example",
]
exclude = [
    "**/__pycache__",
    "**/*.py[cod]",
    "**/.pytest_cache",
    "**/*.png",
    "**/*.jpg",
    "**/*.zip",
    "**/.ruff_cache",
]
# tests/fixtures IS shipped, deliberately. It is 48 KB of plain text and four
# unit modules import from it, so dropping it would put a test suite in the
# tarball that cannot run. To leave tests out of the sdist entirely, remove
# "/tests" from `include` above rather than excluding the fixtures.

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking (see per-file-ignores for route modules)
    "C901",     # mccabe complexity > 15 (audit M15; baseline in per-file-ignores)
    "PLR0915",  # more than 50 statements in one function (same)
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# main.py imports routers mid-file on purpose, interleaved with the
# include_router call each one feeds, to keep the wiring readable and to
# sidestep import cycles. Hoisting 27 imports to the top would obscure that.
# schemas.py defers two imports past a runtime guard for the same reason.
"life_graph/autonomy/safety/schemas.py" = ["E402"]
# TC is off for modules that DEFINE FastAPI routes. FastAPI resolves each
# handler's signature at runtime via get_type_hints() to build validation and
# the OpenAPI schema; a name that only exists under TYPE_CHECKING raises
# PydanticUserError("... is not fully defined") when the schema is built.
# `runtime-evaluated-base-classes` below covers Pydantic/SQLAlchemy models but
# not route handler parameters, which are plain function annotations.
#
# This was verified rather than assumed: applying the rule everywhere broke
# `app.openapi()` (205 paths / 242 operations / 99 schemas). Restricting it to
# non-route modules fixes 121 of the 165 findings with the schema build and
# both suites unchanged. The remaining 44 live in the modules below.
#
# The globs cover all 45 route-defining modules, so a new route file is
# exempt automatically rather than failing CI on its first import.
"life_graph/api/*.py" = ["TC"]
"life_graph/**/router.py" = ["TC"]
"life_graph/main.py" = ["E402", "TC", "PLR0915"]  # PLR0915: lifespan (M15 baseline)
"life_graph/core/metrics.py" = ["TC"]
# ── Complexity baseline (audit M15, 2026-11-20) ──
# C901 (complexity > 15) and PLR0915 (> 50 statements) are on so a NEW god
# function fails lint. These are the files that already held one, with only
# the rule(s) each one breaks. The list only shrinks: split a function, then
# delete its entry. main.py's _start_extended_domains was split (its C901 is
# gone); agents/orchestrator.py run() is the next one, see
# docs/design/orchestrator-run-split-plan.md.
"life_graph/agents/orchestrator.py" = ["C901", "PLR0915"]
"life_graph/api/kernel.py" = ["C901", "PLR0915"]
"life_graph/api/search.py" = ["C901", "PLR0915"]
"life_graph/autonomy/pipeline/service.py" = ["PLR0915"]
"life_graph/cli/root.py" = ["PLR0915"]
"life_graph/connectors/assist.py" = ["PLR0915"]
"life_graph/connectors/brief.py" = ["C901", "PLR0915"]
"life_graph/connectors/chat_context.py" = ["C901", "PLR0915"]
"life_graph/core/aliases.py" = ["C901"]
"life_graph/core/evidence.py" = ["PLR0915"]
"life_graph/core/memory_manager.py" = ["C901", "PLR0915"]
"life_graph/core/slots.py" = ["C901"]
"life_graph/drivers/dispatcher.py" = ["C901"]
"life_graph/drivers/local.py" = ["C901", "PLR0915"]
"life_graph/drivers/steps.py" = ["C901"]
"life_graph/jobs/graph_migration.py" = ["C901"]
"life_graph/kernel/process_manager.py" = ["C901", "PLR0915"]
"life_graph/kernel/project_registry.py" = ["C901"]
"life_graph/self_improving/eval_service.py" = ["PLR0915"]
"life_graph/self_improving/nightly_cron.py" = ["PLR0915"]
"life_graph/services/brief.py" = ["PLR0915"]
"life_graph/services/browser_egress_proxy.py" = ["PLR0915"]
"life_graph/services/capture_processors.py" = ["PLR0915"]
"life_graph/services/destination_validator.py" = ["C901", "PLR0915"]
"life_graph/services/dev/failure_causes.py" = ["C901"]
"life_graph/services/dev/github_pr.py" = ["C901", "PLR0915"]
"life_graph/services/dev/local_merge.py" = ["C901", "PLR0915"]
"life_graph/services/dev/outcomes.py" = ["PLR0915"]
"life_graph/services/dev/sandbox.py" = ["C901", "PLR0915"]
"life_graph/services/dev/setup_guard.py" = ["C901"]
"life_graph/services/dev/task_runtime.py" = ["C901"]
"life_graph/services/dev/tasks.py" = ["C901", "PLR0915"]
"life_graph/services/dev/verifiers.py" = ["C901"]
"life_graph/services/memory/micro_consolidation.py" = ["C901"]
"life_graph/services/memory/retrieval.py" = ["C901", "PLR0915"]
"life_graph/evals/memory_benchmark.py" = ["C901", "PLR0915"]
"life_graph/services/prediction_detection.py" = ["C901"]
"life_graph/services/reminders.py" = ["C901"]
"life_graph/services/workers.py" = ["C901", "PLR0915"]
"life_graph/storage/hybrid.py" = ["C901"]
"life_graph/tools/code.py" = ["C901"]
"life_graph/tools/memory_search.py" = ["C901", "PLR0915"]
"life_graph/workers/tasks.py" = ["PLR0915"]
# CI lints life_graph/ only; tests, scripts and evals are not under the gate.
"tests/**" = ["C901", "PLR0915"]
"scripts/**" = ["C901", "PLR0915"]
"evals/**" = ["C901", "PLR0915"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection callables are *meant* to be evaluated in
# argument defaults — that is the framework's entire calling convention.
# Without this, B008 fires on every single injected dependency.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy resolve annotations at RUNTIME. Moving these
# imports into a TYPE_CHECKING block — which is what TC001/2/3 ask for —
# breaks model construction with an unresolved-forward-ref error at import
# time. Declaring the runtime-evaluated bases keeps the rules on for code
# where they are safe.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "life_graph.models.db.Base",
]
runtime-evaluated-decorators = ["pydantic.validate_call", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["life_graph"]

# ── Layer contracts (audit M12/M13) ─────────────────────────────────────────
# `lint-imports` (import-linter, dev extra) checks these statically, in the CI
# `import-contracts` job. Import chains count, not just direct imports: a
# storage module that imports runtime, which imports a service, breaks
# "storage must not import services". Type-only imports (TYPE_CHECKING) do not.
#
# Every ignore_imports line below is a known violation still in the code,
# tracked in https://github.com/Raceraja001/life-graph/issues/302. Fix one,
# delete its line; never add a line to get a new import past the contracts.
[tool.importlinter]
root_package = "life_graph"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "layers"
name = "api -> services -> core/storage"
type = "layers"
# core and storage are one layer (":" = siblings that may import each other).
layers = ["life_graph.api", "life_graph.services", "life_graph.core : life_graph.storage"]
ignore_imports = [
    # #302: core/memory_manager.py is an ingestion orchestrator filed under
    # core; it calls contradiction, associations, entities, profile_card and
    # the LM client, and reaches services through connectors (for user_tz).
    "life_graph.core.memory_manager -> life_graph.services.**",
    "life_graph.core.memory_manager -> life_graph.connectors.tools",
    # #302: HybridQueryEngine embeds the query via runtime (the composition
    # root, which imports most of services).
    "life_graph.storage.hybrid -> life_graph.runtime",
]

[[tool.importlinter.contracts]]
id = "storage-below-services"
name = "storage imports neither services nor the API"
type = "forbidden"
source_modules = ["life_graph.storage"]
forbidden_modules = ["life_graph.services", "life_graph.api"]
ignore_imports = [
    "life_graph.storage.hybrid -> life_graph.runtime",  # #302, as above
]

[[tool.importlinter.contracts]]
id = "core-below-api"
name = "core does not import the API"
type = "forbidden"
source_modules = ["life_graph.core"]
forbidden_modules = ["life_graph.api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The engine in life_graph/storage/database.py is created at import time with
# a real connection pool. pytest-asyncio otherwise gives each test its own
# event loop, so pooled connections bind to the first loop and every later
# test fails with "attached to a different loop" — then exhausts the pool,
# because connections on abandoned loops are never returned. Sharing one loop
# across the session keeps the pool valid.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"
# network: live tests that need the internet; tests/no_network.py (loaded by
# CI unit job) skips them, as the dev-agent verifier sandbox has no network.
markers = ["network: live test that needs the internet"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── mypy (audit M11, phase 2) ───────────────────────────────────────────────
# Typing is switched on package by package. Everything under life_graph is
# followed (so types flow across packages) but its errors are silenced except
# in the packages that have been brought up to a level:
#   life_graph.core  -- every flag `mypy --strict` turns on
#   life_graph.api   -- a non-strict baseline; the strict error count is
#                       ratcheted by scripts/mypy_ratchet.py against
#                       .github/mypy-api-strict-baseline.txt (may only fall)
# Run it as CI does (the `typecheck` job): `mypy` with no arguments (the
# targets are in `files`), then `python scripts/mypy_ratchet.py`.
# SQLAlchemy 2.0 ships its own annotations (Mapped[...]), so no SQLAlchemy
# plugin -- the old sqlalchemy.ext.mypy plugin is deprecated for 2.0 models.
[tool.mypy]
python_version = "3.12"
files = ["life_graph/core", "life_graph/api"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["life_graph.*"]
ignore_errors = true

# Every per-module flag `--strict` enables (strict = true itself is global-only
# in mypy; warn_unused_configs / warn_redundant_casts are set globally above).
[[tool.mypy.overrides]]
module = ["life_graph.core", "life_graph.core.*"]
ignore_errors = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
no_implicit_reexport = true
strict_equality = true
warn_return_any = true
warn_unused_ignores = true

# The api baseline. Only these flags are set here, so `mypy --strict` from the
# command line (the ratchet) still turns every other strict check on for api.
[[tool.mypy.overrides]]
module = ["life_graph.api", "life_graph.api.*"]
ignore_errors = false
check_untyped_defs = true
warn_unused_ignores = true

# Route modules other work is changing right now (2026-11-20); they join the
# baseline once that lands. Their errors are listed in the PR that added this.
[[tool.mypy.overrides]]
module = ["life_graph.api.admin", "life_graph.api.jarvis", "life_graph.api.kernel"]
ignore_errors = true

# Third-party packages with no type information. Missing from the lock
# (types-PyYAML is not a dependency) or from the typecheck job's install
# (the local-nlp / multimodal extras are not synced there).
[[tool.mypy.overrides]]
module = ["yaml", "sentence_transformers"]
ignore_missing_imports = true
