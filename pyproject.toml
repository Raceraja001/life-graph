[project]
name = "life-graph"
version = "1.0.0"
description = "Brain-inspired memory microservice for SaaS applications"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "racer"}]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",

    # NLP & ML (local, no API cost)
    "spacy>=3.7",
    "sentence-transformers>=3.0",

    # LLM (routing only, minimal usage)
    "litellm>=1.40",
    "google-auth>=2.30",  # Vertex AI credential handling (litellm's vertex_ai/* provider)

    # Cold Start
    "pydriller>=2.6",
    "pyyaml>=6.0",
    "radon>=6.0",

    # Utilities
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "orjson>=3.10",

    # Object Storage
    "minio>=7.2",

    # Redis & Background Jobs (SaaS)
    "redis[hiredis]>=5.0",
    "arq>=0.26",

    # Observability
    "prometheus-client>=0.20",

    # MCP Server (Model Context Protocol)
    "fastmcp>=2.0",
    "mcp>=1.29.0",

    # Web Push Notifications
    "pywebpush>=2.0",
]

[project.optional-dependencies]
multimodal = [
    "faster-whisper>=1.0",
    "pytesseract>=0.3",
    "pymupdf>=1.24",
    "Pillow>=10.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff==0.16.1",  # pinned: an unpinned linter breaks CI with no code change
    "httpx>=0.27",
    "testcontainers[postgres]>=4.7",
]

[project.scripts]
life-graph = "life_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    # "TCH" — flake8-type-checking is OFF. It asks for 165 imports to move
    # into TYPE_CHECKING blocks across api/ and services/. FastAPI and
    # Pydantic resolve annotations at runtime, so whether each move is safe
    # depends on request-time behaviour that the current DB-less test suite
    # cannot exercise — integration tests skip rather than run. The rule has
    # never been satisfied since it was selected, so leaving it off changes
    # nothing operationally. Re-enable once integration tests run against a
    # real Postgres and can actually prove the moves safe.
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
# main.py imports routers mid-file on purpose, interleaved with the
# include_router call each one feeds, to keep the wiring readable and to
# sidestep import cycles. Hoisting 27 imports to the top would obscure that.
"life_graph/main.py" = ["E402"]
# schemas.py defers two imports past a runtime guard for the same reason.
"life_graph/autonomy/safety/schemas.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection callables are *meant* to be evaluated in
# argument defaults — that is the framework's entire calling convention.
# Without this, B008 fires on every single injected dependency.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-type-checking]
# Pydantic and SQLAlchemy resolve annotations at RUNTIME. Moving these
# imports into a TYPE_CHECKING block — which is what TC001/2/3 ask for —
# breaks model construction with an unresolved-forward-ref error at import
# time. Declaring the runtime-evaluated bases keeps the rules on for code
# where they are safe.
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "life_graph.models.db.Base",
]
runtime-evaluated-decorators = ["pydantic.validate_call", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["life_graph"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
