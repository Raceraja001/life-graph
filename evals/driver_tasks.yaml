# Coding-engine benchmark tasks (scripts/bench_drivers.py).
#
# Each task runs on a fresh copy of a fixture app. When the engine finishes,
# `hidden_test` is written into the copy and run in the verifier sandbox: the
# engine never sees it, so a task passes only if the code is actually right,
# whatever the engine's own tests or summary say.

fixtures:
  node-todo:
    path: tests/fixtures/apps/node-todo
    toolchain: node
  python-todo:
    path: life_graph/templates/apps/python-api
    toolchain: python

tasks:
  - id: node-remove
    fixture: node-todo
    instruction: >-
      In src/todos.mjs, add a remove(id) method to the store returned by createStore:
      it deletes the todo with that id and returns it, and throws Error('no todo <id>')
      when there is none.
    hidden_test:
      path: tests/hidden.test.mjs
      command: [npx, vitest, run, tests/hidden.test.mjs]
      content: |
        import {describe, expect, it} from 'vitest'
        import {createStore} from '../src/todos.mjs'
        describe('remove', () => {
            it('removes and returns the todo', () => {
                const s = createStore()
                const a = s.add('a'); s.add('b')
                expect(s.remove(a.id)).toEqual(a)
                expect(s.list().map((t) => t.title)).toEqual(['b'])
            })
            it('throws for a missing id', () => {
                expect(() => createStore().remove(9)).toThrow('no todo 9')
            })
        })

  - id: node-toggle
    fixture: node-todo
    instruction: >-
      In src/todos.mjs, add a toggle(id) method to the store: it flips the todo's done
      flag (false to true, true to false) and returns the todo; it throws
      Error('no todo <id>') when there is none.
    hidden_test:
      path: tests/hidden.test.mjs
      command: [npx, vitest, run, tests/hidden.test.mjs]
      content: |
        import {expect, it} from 'vitest'
        import {createStore} from '../src/todos.mjs'
        it('toggles done both ways', () => {
            const s = createStore()
            const a = s.add('a')
            expect(s.toggle(a.id).done).toBe(true)
            expect(s.toggle(a.id).done).toBe(false)
            expect(s.list()[0].done).toBe(false)
        })
        it('throws for a missing id', () => {
            expect(() => createStore().toggle(3)).toThrow('no todo 3')
        })

  - id: node-search
    fixture: node-todo
    instruction: >-
      In src/todos.mjs, add a search(query) method to the store that returns copies of
      the todos whose title contains query, case-insensitively, in their original order.
      An empty query returns every todo.
    hidden_test:
      path: tests/hidden.test.mjs
      command: [npx, vitest, run, tests/hidden.test.mjs]
      content: |
        import {expect, it} from 'vitest'
        import {createStore} from '../src/todos.mjs'
        it('finds by title, case-insensitively', () => {
            const s = createStore()
            s.add('Buy MILK'); s.add('walk dog'); s.add('milk the cow')
            expect(s.search('milk').map((t) => t.title)).toEqual(['Buy MILK', 'milk the cow'])
            expect(s.search('').length).toBe(3)
        })
        it('returns copies', () => {
            const s = createStore()
            s.add('x')
            s.search('x')[0].title = 'changed'
            expect(s.list()[0].title).toBe('x')
        })

  - id: py-remove
    fixture: python-todo
    instruction: >-
      In app/store.py, add a remove(item_id) method to Store: it deletes the item with
      that id and returns it, and raises KeyError when there is none.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py]
      content: |
        import pytest
        from app.store import Store

        def test_remove_returns_and_deletes():
            s = Store()
            a = s.add("a"); s.add("b")
            assert s.remove(a["id"]) == a
            assert [i["title"] for i in s.list()] == ["b"]

        def test_remove_missing_raises():
            with pytest.raises(KeyError):
                Store().remove(7)

  - id: py-complete
    fixture: python-todo
    instruction: >-
      In app/store.py, add a complete(item_id) method to Store that marks the item done
      and returns a copy of it; it raises KeyError when there is no such item.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py]
      content: |
        import pytest
        from app.store import Store

        def test_complete_marks_done():
            s = Store()
            a = s.add("a")
            done = s.complete(a["id"])
            assert done["done"] is True and s.list()[0]["done"] is True
            done["title"] = "changed"
            assert s.list()[0]["title"] == "a"

        def test_complete_missing_raises():
            with pytest.raises(KeyError):
                Store().complete(1)

  - id: py-stats
    fixture: python-todo
    instruction: >-
      In app/store.py, add a stats() method to Store returning a dict with keys "total",
      "done" and "open": the number of items, of done items, and of items not done.
      Items have a boolean "done" field.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py]
      content: |
        from app.store import Store

        def test_stats():
            s = Store()
            assert s.stats() == {"total": 0, "done": 0, "open": 0}
            s.add("a"); s.add("b")
            s._items[0]["done"] = True
            assert s.stats() == {"total": 2, "done": 1, "open": 1}

  # ── Added 2026-11-18 (secure-execution-runtime Stage 5): other kinds of work ──
  # `setup` files are written before the fixture is committed, so the engine
  # starts from a repo that already has the bug / the old shape in it.

  - id: py-bugfix
    fixture: python-todo
    category: bugfix
    setup:
      app/store.py: |
        """An in-memory to-do list: the logic the unit tests cover."""

        from __future__ import annotations


        class Store:
            def __init__(self) -> None:
                self._items: list[dict] = []

            def add(self, title: str) -> dict:
                clean = (title or "").strip()
                if not clean:
                    raise ValueError("title is required")
                item = {"id": len(self._items), "title": clean, "done": False}
                self._items.append(item)
                return item

            def list(self) -> list[dict]:
                return self._items
    instruction: >-
      The test suite (tests/test_store.py) fails. Find and fix the bug or bugs in app/
      without changing the tests. Callers must not be able to change the store's items
      through what list() returns.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py, tests/test_store.py]
      content: |
        from app.store import Store

        def test_ids_start_at_one_and_are_unique():
            s = Store()
            ids = [s.add(t)["id"] for t in ("a", "b", "c")]
            assert ids == [1, 2, 3]

        def test_list_is_a_copy():
            s = Store()
            s.add("a")
            s.list()[0]["title"] = "hacked"
            s.list().clear()
            assert [i["title"] for i in s.list()] == ["a"]

  - id: py-refactor
    fixture: python-todo
    category: refactor
    instruction: >-
      Rename Store.list() to Store.all() everywhere it is defined or used (app/ and
      tests/). Keep list() working as a thin alias that calls all(), for old callers.
      Behaviour must not change.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py]
      content: |
        import inspect
        from app import server
        from app.store import Store

        def test_all_returns_copies():
            s = Store()
            s.add("a")
            got = s.all()
            got[0]["title"] = "x"
            assert s.all()[0]["title"] == "a"

        def test_list_still_works_and_matches():
            s = Store()
            s.add("a"); s.add("b")
            assert s.list() == s.all()

        def test_server_uses_the_new_name():
            assert "store.all()" in inspect.getsource(server)

  - id: py-multifile
    fixture: python-todo
    category: multi_file
    instruction: >-
      Add deleting a to-do over HTTP: DELETE /api/todos/<id> in app/server.py, backed by
      a new Store.remove(item_id) in app/store.py that deletes and returns the item and
      raises KeyError when there is none. Respond 204 with no body on success, 404 with
      {"error": "not found"} when the id does not exist or is not a number.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py]
      content: |
        import json
        import threading
        import urllib.error
        import urllib.request
        from http.server import ThreadingHTTPServer

        import pytest
        from app import server

        @pytest.fixture
        def base():
            server.store = server.Store()
            httpd = ThreadingHTTPServer(("127.0.0.1", 0), server.Handler)
            threading.Thread(target=httpd.serve_forever, daemon=True).start()
            yield f"http://127.0.0.1:{httpd.server_address[1]}"
            httpd.shutdown()

        def call(method, url, body=None):
            data = json.dumps(body).encode() if body is not None else None
            req = urllib.request.Request(url, data=data, method=method,
                                         headers={"content-type": "application/json"})
            try:
                with urllib.request.urlopen(req) as r:
                    return r.status, r.read()
            except urllib.error.HTTPError as e:
                return e.code, e.read()

        def test_delete_removes(base):
            call("POST", f"{base}/api/todos", {"title": "a"})
            status, body = call("DELETE", f"{base}/api/todos/1")
            assert status == 204 and body == b""
            assert json.loads(call("GET", f"{base}/api/todos")[1]) == []

        def test_delete_missing_is_404(base):
            assert call("DELETE", f"{base}/api/todos/9")[0] == 404
            assert call("DELETE", f"{base}/api/todos/abc")[0] == 404

        def test_store_remove_raises_keyerror():
            with pytest.raises(KeyError):
                server.Store().remove(5)

  - id: py-validate
    fixture: python-todo
    category: edge_cases
    instruction: >-
      Tighten Store.add in app/store.py: collapse any run of whitespace inside the title
      to a single space (after trimming the ends), and reject titles longer than 100
      characters after that with ValueError("title too long"). Empty titles stay
      rejected as now.
    hidden_test:
      path: tests/test_hidden.py
      command: [python, -m, pytest, -q, tests/test_hidden.py]
      content: |
        import pytest
        from app.store import Store

        def test_collapses_inner_whitespace():
            assert Store().add("  buy \t\n  milk  ")["title"] == "buy milk"

        def test_exactly_100_is_fine_101_is_not():
            assert len(Store().add("x" * 100)["title"]) == 100
            with pytest.raises(ValueError, match="title too long"):
                Store().add("x" * 101)

        def test_long_only_because_of_spaces_is_fine():
            assert Store().add("a" + " " * 200 + "b")["title"] == "a b"

        def test_empty_still_rejected():
            with pytest.raises(ValueError):
                Store().add(" \t ")
