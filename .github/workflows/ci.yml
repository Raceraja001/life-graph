# Life Graph CI Pipeline
#
# Jobs:
#   lint   — ruff check + format verification
#   lockfile — uv.lock matches pyproject.toml
#   extras-smoke — every extra installs from uv.lock and imports
#   dependency-audit — pip-audit of uv.lock (blocking, dated ignore list)
#   test   — unit + integration tests against real pgvector+MinIO, with coverage
#   sdk-ts — TypeScript SDK build check
#
# Every Python test job installs from uv.lock (`uv sync --locked`), never
# from the version ranges in pyproject.toml, so CI tests exactly the versions
# the Docker image and a release install. `--locked` rather than `--frozen`:
# --frozen trusts uv.lock blindly even when pyproject.toml has moved on,
# while --locked refuses to install from a lock that no longer matches.
#
# Triggers on every pull request, whatever its base branch. Dev-agent PRs
# target feature branches (feat/...), and the merge gate requires every check
# on a PR to pass, so a PR that CI never ran on had no gate but the agent's
# own verifiers. Also on pushes to master/main and to feat/** branches.

name: Life Graph CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.16.1

      - name: Check linting
        run: ruff check life_graph/

      - name: Check formatting
        run: ruff format --check life_graph/

  # uv.lock is the record of exactly which versions the dependency ranges in
  # pyproject.toml resolve to. It went stale for six weeks (2026-10-03 to
  # 11-19) because nothing checked it; `uv lock --check` fails when the two
  # disagree, so a dependency change must come with `uv lock` in the same PR.
  # The uv version is pinned so a uv release cannot change the lock format
  # under an unchanged pyproject.
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  # The lock must also INSTALL, with every extra, and each optional feature's
  # imports must work. The test jobs only install dev + local-nlp, so an extra
  # (multimodal, cold-start, browser-sandbox, watchers, `all`) could otherwise
  # stop resolving or importing with every other check green. The Python 3.11
  # dry run keeps `requires-python = ">=3.11"` honest: pr-agent needs 3.12+
  # and is excluded there by its python_version marker; if that marker broke,
  # the 3.11 plan would fail to resolve.
  extras-smoke:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: |
            3.11
            3.12

      - name: Install uv
        run: pip install uv==0.12.14

      - name: Install every extra from uv.lock (Python 3.12)
        run: uv sync --locked --extra all --python 3.12

      - name: Import every optional feature
        run: |
          .venv/bin/python - <<'EOF'
          import importlib
          extras = {
              "core": ["life_graph.main", "life_graph.mcp_server"],
              "multimodal": ["faster_whisper", "pytesseract", "pymupdf", "PIL", "docx"],
              "watchers": ["aiosmtplib", "asyncssh", "git"],
              "cold-start": ["pydriller", "radon"],
              "local-nlp": ["spacy", "sentence_transformers", "torch"],
              "browser-sandbox": ["playwright.async_api"],
          }
          for extra, modules in extras.items():
              for name in modules:
                  importlib.import_module(name)
              print(f"{extra}: ok ({', '.join(modules)})")
          # The lock pins the CPU build on Linux; a CUDA torch here means the
          # [tool.uv.sources] pin in pyproject.toml stopped applying.
          import torch
          assert "+cpu" in torch.__version__, torch.__version__
          print("torch", torch.__version__)
          EOF

      - name: Resolve every extra on Python 3.11 (dry run)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv311
        run: |
          uv sync --locked --all-extras --python 3.11 --dry-run > plan311.txt 2>&1 || { cat plan311.txt; exit 1; }
          tail -3 plan311.txt
          if grep -q "pr-agent" plan311.txt; then
            echo "::error::pr-agent is in the Python 3.11 install plan; its python_version >= '3.12' marker in pyproject.toml no longer applies"
            exit 1
          fi

  # Known vulnerabilities in the locked dependency set (every extra included,
  # so it covers what a full deployment can install). BLOCKING (audit H6):
  # any advisory not listed in .github/pip-audit-ignore.txt fails this job,
  # and so does a listed one whose review-by date has passed -- an ignore
  # cannot outlive its review. The list carries the advisories that are
  # blocked upstream (pr-agent's exact pins), each with its reason.
  # pip-audit is pinned to the version in uv.lock.
  #
  # torch is locked as 2.15.0+cpu on Linux/Windows; PyPI has no "+cpu"
  # version, so pip-audit skips that line with a notice. The same torch
  # release is still audited through the macOS line (torch==2.15.0).
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and pip-audit
        run: pip install uv==0.12.14 pip-audit==2.10.1

      - name: Export the locked requirements
        run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o locked-requirements.txt

      - name: pip-audit (blocking; reviewed ignores in .github/pip-audit-ignore.txt)
        run: |
          today=$(date -u +%F)
          ignore_args=()
          stale=0
          while read -r id pkg review_by reason; do
            case "$id" in ''|'#'*) continue ;; esac
            if ! [[ "$review_by" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || [ -z "$reason" ]; then
              echo "::error file=.github/pip-audit-ignore.txt::malformed entry for $id (need: ID PACKAGE YYYY-MM-DD REASON)"
              stale=1
              continue
            fi
            if [[ "$review_by" < "$today" ]]; then
              echo "::error file=.github/pip-audit-ignore.txt::ignore for $id ($pkg) expired on $review_by: re-check the blocker, then fix it or renew the entry"
              stale=1
            fi
            ignore_args+=(--ignore-vuln "$id")
          done < .github/pip-audit-ignore.txt
          echo "ignoring $(( ${#ignore_args[@]} / 2 )) reviewed advisories"
          set +e
          pip-audit -r locked-requirements.txt --disable-pip --no-deps \
            --progress-spinner off "${ignore_args[@]}" \
            --format markdown --output audit.md
          status=$?
          set -e
          {
            echo "## pip-audit of uv.lock"
            cat audit.md 2>/dev/null || echo "(no report written)"
          } >> "$GITHUB_STEP_SUMMARY"
          cat audit.md 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            echo "::error::pip-audit found a known vulnerability that is not in .github/pip-audit-ignore.txt (exit $status); see the job summary. Fix it (bump within the caps in pyproject.toml, then uv lock) or, if it is blocked upstream, add a dated entry with the reason."
            exit "$status"
          fi
          exit "$stale"

  # Not gated on lint. From 2026-11-13 to 11-16 a handful of ruff errors
  # failed lint on every push, and with needs: lint both test jobs were
  # skipped -- fifteen merges reached master without the suite running once.
  # Lint is still a required check of its own; it just can no longer hide
  # the test result.
  unit-tests:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      # The synced environment itself, not just downloads: a cold install
      # takes ~90 s. Keyed on uv.lock (so any dependency change, and every
      # lock refresh, installs afresh) and on the exact interpreter version,
      # because the venv links to setup-python's interpreter. On a hit the
      # `uv sync` below still runs: it checks the venv against the lock
      # (a no-op when they match) and installs this checkout's editable copy.
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-dev-local-nlp-${{ hashFiles('uv.lock') }}

      # local-nlp carries spaCy and sentence-transformers. They left the core
      # dependency set when the base install was cut from 5.4 GB to 369 MB,
      # but CI still needs them: the spaCy model below and the API server's
      # embedding-backend startup check both fail without them. torch comes
      # in as the CPU build -- uv.lock pins it ([tool.uv.sources]).
      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --extra local-nlp --python "${{ steps.py.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      # Not on PyPI, so not in uv.lock: pinned by URL + sha256 (same as the
      # Dockerfile). `spacy download` would shell out to pip, which a uv venv
      # does not have. Re-run on every job: `uv sync` removes it as
      # not-in-the-lock.
      - name: Install spaCy model
        run: uv pip install "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"

      - name: Run unit tests
        # -n auto: parallel, and it fails if two workers collect different test
        # ids (e.g. a uuid4() in a parametrize id), which keeps -n usable locally.
        # Coverage is measured but not yet gated (no --cov-fail-under): the
        # first runs set the baseline a threshold can be chosen from.
        run: >-
          python -m pytest tests/unit/ -n auto -q --tb=short -p tests.no_network
          --cov=life_graph --cov-report=xml:coverage-unit.xml --cov-report=term

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml
          if-no-files-found: warn

      # The two evaluation laboratories are regression gates, not reports: each
      # --verify re-runs the committed suite and exits non-zero when a quality
      # threshold (recall/precision, calibration error) has regressed.
      - name: Verify Memory Evaluation Laboratory Gates
        run: python scripts/eval_memory_benchmark.py --verify

      - name: Verify Confidence Calibration Gates
        run: python scripts/eval_confidence_calibration.py --verify

  # docs/STATE.md is generated from the code and was regenerated by hand —
  # so it was three weeks stale by 2026-10-24. After every merge to master
  # it is regenerated here and committed back when the inventory changed.
  # The "Generated …" stamp alone is not a change (-I), so an unchanged
  # inventory makes no commit. Both files carry one: STATE.md's line starts
  # with Generated, the HTML's with <p class="sub">Generated from. Matching
  # only the first made the bot commit a new timestamp after every merge.
  # The bot push does not trigger this workflow.
  state-doc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: unit-tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-dev-local-nlp-${{ hashFiles('uv.lock') }}

      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --extra local-nlp --python "${{ steps.py.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install spaCy model
        run: uv pip install "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"

      - name: Regenerate docs/STATE.md
        run: python scripts/gen_state.py --html

      - name: Commit when the inventory changed
        run: |
          if git diff --quiet -I '^Generated `' -I '^<p class="sub">Generated from ' \
               -- docs/STATE.md docs/feature-inventory.html; then
            echo "Inventory unchanged"
            git checkout -- docs/STATE.md docs/feature-inventory.html
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/STATE.md docs/feature-inventory.html
          git commit -m "docs(state): regenerate the inventory [skip ci]"
          git push

  integration-tests:
    runs-on: ubuntu-latest
    # Not after unit-tests: the two are independent, and running them side
    # by side makes CI as long as the slower one, not the sum. Both must
    # still pass to merge. Not gated on lint either (see unit-tests).

    # Postgres is NOT a service container here. Life Graph needs pgvector *and*
    # Apache AGE in the same server, and no published image carries both — AGE
    # is compiled from source by Dockerfile.postgres, which is exactly the image
    # the local stack and production run. `services:` can only pull a pre-built
    # image, so this job builds that Dockerfile and starts it by hand instead.
    #
    # Before this, CI used pgvector/pgvector:pg16, migration 002 hit
    # `extension "age" is not available`, and the job died at the migration
    # step — the integration suite had never actually executed here.
    #
    # MinIO is not a service container either. A service whose image cannot
    # be pulled fails the whole job before a single step runs, and quay.io
    # started answering "unauthorized" for the pinned MinIO release: every CI
    # run since 2026-10-03 died there. It is started as an optional step
    # below instead, and the archive tests skip themselves when it is absent.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LIFE_GRAPH_DATABASE_URL: postgresql+asyncpg://life_graph:life_graph_dev@localhost:5432/life_graph
      LIFE_GRAPH_DATABASE_URL_SYNC: postgresql://life_graph:life_graph_dev@localhost:5432/life_graph
      LIFE_GRAPH_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Compiling AGE takes minutes from cold; the layer cache makes repeat runs
      # near-instant, so this costs full price only when the Dockerfile or its
      # base image actually changes.
      - name: Build Postgres image (pgvector + Apache AGE)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          tags: life-graph-postgres:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres
        run: |
          docker run -d --name life_graph_ci_db \
            -e POSTGRES_USER=life_graph \
            -e POSTGRES_PASSWORD=life_graph_dev \
            -e POSTGRES_DB=life_graph \
            -p 5432:5432 \
            -v "${{ github.workspace }}/scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro" \
            life-graph-postgres:ci \
            postgres -c shared_preload_libraries=age

      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 60); do
            if docker exec life_graph_ci_db pg_isready -U life_graph -d life_graph >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready" >&2
          docker logs life_graph_ci_db >&2
          exit 1

      # Fail loudly here if the image is missing an extension, rather than
      # letting it surface as a confusing failure inside a migration.
      - name: Verify pgvector + AGE are present
        run: |
          docker exec life_graph_ci_db psql -U life_graph -d life_graph -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS age;" \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname IN ('vector', 'age') ORDER BY extname;"

      - name: Start MinIO (optional)
        continue-on-error: true
        run: |
          for image in quay.io/minio/minio:latest minio/minio:latest bitnami/minio:latest; do
            if docker pull -q "$image" >/dev/null 2>&1; then
              docker run -d --name life_graph_ci_minio -p 9000:9000 \
                -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
                "$image" server /data && echo "minio from $image" && exit 0
            fi
          done
          echo "::warning::no MinIO image could be pulled; archive tests will skip"

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      # Same locked install and venv cache as the unit-tests job.
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-dev-local-nlp-${{ hashFiles('uv.lock') }}

      - name: Install dependencies from uv.lock
        env:
          UV_PYTHON_DOWNLOADS: never
        run: |
          uv sync --locked --extra dev --extra local-nlp --python "${{ steps.py.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Install spaCy model
        run: uv pip install "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85"

      - name: Run database migrations
        run: python -m alembic upgrade head

      # A migration that leaves its connection mid-transaction applies nothing
      # while `alembic upgrade head` still exits 0. Assert the schema is really
      # there instead of trusting the exit code.
      - name: Verify migrations actually landed
        run: |
          docker exec life_graph_ci_db psql -U life_graph -d life_graph -v ON_ERROR_STOP=1 \
            -c "SELECT version_num FROM alembic_version;" \
            -c "SELECT to_regclass('public.memories') IS NOT NULL AS memories_exists;"

      # There used to be a "Start API server" step here: uvicorn on :8000,
      # backgrounded, then `sleep 10`. Nothing checked it came up and no test
      # talks to :8000 -- the integration suite drives the app in-process
      # through httpx's ASGITransport -- so it only cost ten seconds.

      - name: Run integration tests
        run: >-
          python -m pytest tests/integration/ -q --tb=short
          --cov=life_graph --cov-report=xml:coverage-integration.xml --cov-report=term

      # The Postgres half of tests/unit/test_exact_bound_capabilities.py is
      # skipped wherever there is no migrated database, which is every unit
      # job -- so until this step it had never run in CI. It runs after the
      # integration suite because that suite's session fixture is what creates
      # and migrates the test database these tests connect to.
      # LIFE_GRAPH_REQUIRE_POSTGRES_TESTS turns "skipped, no database" into a
      # collection error here, so a broken database cannot pass as green.
      - name: Run Postgres-backed unit tests
        if: ${{ !cancelled() }}
        env:
          LIFE_GRAPH_REQUIRE_POSTGRES_TESTS: "1"
        run: python -m pytest tests/unit/test_exact_bound_capabilities.py -q --tb=short -rs

      - name: Upload integration coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: warn

      - name: Postgres logs on failure
        if: failure()
        run: docker logs life_graph_ci_db

  dashboard:
    name: Dashboard Lint + Build + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # Report-only: on 2026-11-20 the production dependency tree had 6
      # advisories (1 critical, 4 high), several only fixable by majors that
      # the open dependabot PRs are still failing on. Make this blocking
      # (drop the `||` branch) once those land. sdks/typescript has no
      # lockfile committed, so it cannot be audited the same way yet.
      - name: npm audit (production deps, report-only)
        run: |
          npm audit --omit=dev --audit-level=high \
            || echo "::warning::npm audit found high/critical advisories in dashboard production deps (report-only); see the log"

  sdk-typescript:
    name: TypeScript SDK Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  # Static types (audit M11). life_graph/core passes every `--strict` check;
  # life_graph/api passes a baseline (check_untyped_defs, warn_unused_ignores,
  # no_implicit_optional) and its `--strict` error count may only go down
  # (.github/mypy-api-strict-baseline.txt). Config: [tool.mypy] in
  # pyproject.toml. mypy is pinned in the dev extra and comes from uv.lock
  # like everything else; only the dev extra is synced -- the type check
  # needs no NLP/torch stack (sentence_transformers is ignore_missing_imports).
  typecheck:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-dev-${{ hashFiles('uv.lock') }}

      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --python "${{ steps.py.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: mypy (core strict, api baseline)
        run: mypy

      - name: mypy --strict ratchet for life_graph/api
        run: python scripts/mypy_ratchet.py

  # Layer contracts (audit M12/M13): api -> services -> core/storage, storage
  # never imports services or the API, core never imports the API. Defined in
  # pyproject.toml [tool.importlinter]; the known exceptions there are
  # tracked in issue #302. Static analysis of the source -- nothing is
  # imported or run -- but the linter itself comes from uv.lock (dev extra).
  import-contracts:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      - name: Install the dev extra from uv.lock
        run: uv sync --locked --extra dev --python "${{ steps.py.outputs.python-path }}"

      - name: Check the import contracts
        run: .venv/bin/lint-imports --no-cache

  # Audit M18 (2026-11-20): migrations were only ever run forwards, once, on
  # an empty database, and nothing compared the models with the schema they
  # build. This job runs the whole chain up, all the way down, and up again
  # on a throwaway Postgres (the same pgvector + AGE image as the
  # integration job), then checks the models against the result with
  # scripts/schema_drift.py: known differences are listed in
  # alembic/schema_drift_baseline.txt, and any new one -- or any baseline
  # line that no longer occurs -- fails the job.
  #
  # Downgrades 038, 040, 041 and 042 delete rows by design (see the comment
  # on each); on this empty database there is nothing to lose.
  migration-safety:
    name: Migrations (up, down, up) + schema drift
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
      LIFE_GRAPH_DATABASE_URL: postgresql+asyncpg://life_graph:life_graph_dev@localhost:5432/life_graph
      LIFE_GRAPH_DATABASE_URL_SYNC: postgresql://life_graph:life_graph_dev@localhost:5432/life_graph
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Postgres image (pgvector + Apache AGE)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.postgres
          tags: life-graph-postgres:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start Postgres
        run: |
          docker run -d --name life_graph_mig_db \
            -e POSTGRES_USER=life_graph \
            -e POSTGRES_PASSWORD=life_graph_dev \
            -e POSTGRES_DB=life_graph \
            -p 5432:5432 \
            -v "${{ github.workspace }}/scripts/init_db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro" \
            life-graph-postgres:ci \
            postgres -c shared_preload_libraries=age
          for _ in $(seq 1 60); do
            if docker exec life_graph_mig_db pg_isready -U life_graph -d life_graph >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          docker logs life_graph_mig_db >&2
          exit 1

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv==0.12.14

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-dev-local-nlp-${{ hashFiles('uv.lock') }}

      - name: Install dependencies from uv.lock
        run: |
          uv sync --locked --extra dev --extra local-nlp --python "${{ steps.py.outputs.python-path }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Upgrade to head
        run: python -m alembic upgrade head

      - name: Downgrade to base
        run: |
          python -m alembic downgrade base
          # Nothing of ours may survive a full downgrade.
          left=$(docker exec life_graph_mig_db psql -U life_graph -d life_graph -tA -c \
            "SELECT count(*) FROM alembic_version")
          test "$left" = "0" || { echo "alembic_version still has $left row(s)"; exit 1; }

      - name: Upgrade to head again
        run: |
          python -m alembic upgrade head
          head=$(python -m alembic heads 2>/dev/null | awk '{print $1}')
          at=$(docker exec life_graph_mig_db psql -U life_graph -d life_graph -tA -c \
            "SELECT version_num FROM alembic_version")
          echo "head=$head database=$at"
          test "$at" = "$head"

      - name: Model/schema drift
        run: python scripts/schema_drift.py --check

      - name: Postgres logs on failure
        if: failure()
        run: docker logs life_graph_mig_db
